name: Fuzz Upload Action
author: Asymmetric Research
description: Upload fuzzing data to FuzzCorp
branding:
  icon: upload-cloud
  color: blue

inputs:
  upload_type:
    description: 'Type of data to upload (bundle|corpus)'
    required: true
  upload_path:
    description: Path to file/directory to upload
    required: true
  upload_args:
    description: 'Arguments/flags to pass to `fuzz-up upload`'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        UPLOAD_TYPE: ${{ inputs.upload_type }}
        UPLOAD_PATH: ${{ inputs.upload_path }}
        UPLOAD_ARGS: ${{ inputs.upload_args }}
      run: |
        # Validate type input
        case "$UPLOAD_TYPE" in
          bundle|corpus)
            echo "Type: $UPLOAD_TYPE"
            ;;
          *)
            echo "Error: Invalid type '$UPLOAD_TYPE'. Must be one of: bundle, corpus"
            exit 1
            ;;
        esac

        # Validate path exists
        if [ ! -e "$UPLOAD_PATH" ]; then
          echo "Error: Path '$UPLOAD_PATH' does not exist"
          exit 1
        fi

        # Validate required flags
        if [ "$UPLOAD_TYPE" = "corpus" ]; then
          if ! echo "$UPLOAD_ARGS" | grep -qE -- '--lineage([[:space:]]+[^[:space:]-]|=[^[:space:]]+)'; then
            echo "Error: Corpus uploads must include '--lineage <value>' or '--lineage=<value>'"
            exit 1
          fi
        fi

        echo "Path: $UPLOAD_PATH"
        echo "Args: $UPLOAD_ARGS"

    - name: Validate env
      shell: bash
      run: |
        # Validate required environment variables
        if [ -z "$FUZZ_ORGANIZATION" ] || [ -z "$FUZZ_PROJECT" ] || [ -z "$FUZZ_API_KEY" ]; then
          echo "Error: Missing required FuzzCorp credentials. Set FUZZ_API_KEY, FUZZ_ORGANIZATION, and FUZZ_PROJECT environment variables."
          exit 1
        fi

    - name: Detect platform
      id: platform
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux)
            os=linux
            ;;
          macOS)
            os=darwin
            ;;
          *)
            echo "Error: Unsupported OS '${{ runner.os }}'. fuzz-up only supports Linux and macOS."
            exit 1
            ;;
        esac

        case "${{ runner.arch }}" in
          X64)
            arch=amd64
            ;;
          ARM64)
            arch=arm64
            ;;
          *)
            echo "Error: Unsupported architecture '${{ runner.arch }}'. fuzz-up only supports X64 (amd64) and ARM64."
            exit 1
            ;;
        esac

        echo "os=$os" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
        echo "binary_name=fuzz-up_${os}_${arch}" >> "$GITHUB_OUTPUT"
        echo "download_dir=$RUNNER_TEMP/fuzz-up-download" >> "$GITHUB_OUTPUT"

    - name: Download fuzz-up
      shell: bash
      env:
        BINARY_NAME: ${{ steps.platform.outputs.binary_name }}
        DOWNLOAD_DIR: ${{ steps.platform.outputs.download_dir }}
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Downloading fuzz-up for ${{ steps.platform.outputs.os }} ${{ steps.platform.outputs.arch }}..."

        if ! gh release download --repo asymmetric-research/fuzz-up --pattern "$BINARY_NAME" --pattern "attestations.sigstore.json" --dir "$DOWNLOAD_DIR" --clobber; then
          echo "Error: Failed to download fuzz-up release"
          exit 1
        fi

        if [ ! -f "$DOWNLOAD_DIR/$BINARY_NAME" ]; then
          echo "Error: Downloaded file '$BINARY_NAME' not found"
          exit 1
        fi

        if [ ! -f "$DOWNLOAD_DIR/attestations.sigstore.json" ]; then
          echo "Error: Attestation bundle 'attestations.sigstore.json' not found"
          exit 1
        fi

    - name: Verify fuzz-up attestation
      shell: bash
      env:
        BINARY_NAME: ${{ steps.platform.outputs.binary_name }}
        DOWNLOAD_DIR: ${{ steps.platform.outputs.download_dir }}
      run: |
        echo "Verifying fuzz-up build-provenance attestation..."
        if ! gh attestation verify "$DOWNLOAD_DIR/$BINARY_NAME" \
            --bundle "$DOWNLOAD_DIR/attestations.sigstore.json" \
            --repo asymmetric-research/fuzzcorp \
            --cert-identity-regex '^https://github\.com/asymmetric-research/fuzzcorp/\.github/workflows/fuzz-up-release\.yml@refs/tags/.+$' \
            --deny-self-hosted-runners; then
          echo "Error: Attestation verification failed for fuzz-up binary"
          exit 1
        fi

    - name: Install fuzz-up
      shell: bash
      env:
        BINARY_NAME: ${{ steps.platform.outputs.binary_name }}
        DOWNLOAD_DIR: ${{ steps.platform.outputs.download_dir }}
        INSTALL_DIR: ${{ runner.temp }}/fuzz-up-bin
      run: |
        mkdir -p "$INSTALL_DIR"
        mv "$DOWNLOAD_DIR/$BINARY_NAME" "$INSTALL_DIR/fuzz-up"
        chmod +x "$INSTALL_DIR/fuzz-up"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

        # Report version
        "$INSTALL_DIR/fuzz-up" version

    - name: Upload to FuzzCorp
      shell: bash
      env:
        UPLOAD_TYPE: ${{ inputs.upload_type }}
        UPLOAD_PATH: ${{ inputs.upload_path }}
        UPLOAD_ARGS: ${{ inputs.upload_args }}
      run: |
        fuzz-up upload "$UPLOAD_TYPE" $UPLOAD_ARGS "$UPLOAD_PATH"
